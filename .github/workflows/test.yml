name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile-check
        run: python -m compileall -q core agents workflows api configs tests alembic

      - name: Run smoke + hardening tests (no services required)
        run: pytest tests/test_smoke.py tests/test_hardening.py tests/test_hardening_v2.py -v --tb=short

      - name: Validate Alembic config (parse only; no DB)
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          cfg = Config("alembic.ini")
          script = ScriptDirectory.from_config(cfg)
          revs = list(script.walk_revisions())
          assert revs, "no alembic revisions found"
          assert script.get_current_head() == "0001_initial"
          print(f"OK: alembic head = {script.get_current_head()}")
          PY

      - name: Upload pytest cache on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.os }}-py${{ matrix.python }}
          path: .pytest_cache/
          if-no-files-found: ignore
